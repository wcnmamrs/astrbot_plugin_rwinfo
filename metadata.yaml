name: astrbot_plugin_rwinfo
display_name: 铁锈查房
short_desc: 自动识别群消息中的铁锈战争房间号并安排探针查房, 另提供房间列表查询
desc: |
  铁锈战争房间查询插件:
  - 自动识别群/私聊消息中的房间号并安排探针查房
    支持 首字母+数字 (r5132/a5132/h1234/c8888/o9999 等, 任意中继首字母)
    支持 国际房 纯字母 h 开头 (hytvvi/hlbifz)
    支持 直连地址 IP 或 IP:端口
  - 安排探针机器人 (ABAB探针01~99) 查询房间信息并回传
  - 查询到有效房间信息才发送, 查不到自动静默
  - 房间列表指令 (分页 + 按 QQ 号缓存 60 秒):
    数据源为真人房 Q Room List + 官方 Auto Server, 自动过滤广告房
    支持按类型(模组/原版)、状态(房间中/游戏中)、人数(满/不满)、来源筛选
    支持按房主名/地图名搜索
  - 支持黑白名单(用户/群)权限控制; 混合模式(@用户优先于#群, 同名互斥); 私聊策略可配
version: 1.5.0
author: wcnmamrs
repo: "https://github.com/wcnmamrs/astrbot_plugin_rwinfo"
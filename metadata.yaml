name: astrbot_plugin_rwinfo
display_name: 铁锈查房
short_desc: 自动识别群消息中的铁锈战争房间号并安排探针查房, 另提供房间列表查询
desc: |
  铁锈战争房间查询插件:
  - 自动识别群/私聊消息中的房间号并安排探针查房
    数字房: o/q/r/s + 数字 (r5132/s1024/o9999/q7777)
    字母房: 其他字母 + 纯字母 (hytvvi/aabcde/babc)
    两种房号均需 3 位以上; 纯数字/混合格式/IP 不自动识别
    容忍连写与重复: rr5132 / r5132r5132 归一化为 r5132
  - 安排探针机器人 (<前缀>探针01~99, 前缀可配置) 查询房间信息并回传
  - 查询到有效房间信息才发送, 查不到自动静默
  - /铁锈查房 显式查房: 支持列表序号、房号、IP:端口
    显式查房失败会回传原因(与自动触发的静默相反)
  - 房间短号自动获取: 从房间列表进的房只知道 UUID,
    插件会自动拿到 s5132 这类可分享短号
    (优先被动捕获服务端推送, 抓不到再发 .id 询问)
  - 房间列表指令 (分页 + 按 群+用户 隔离状态):
     数据源为真人房 Q Room List + 官方 masterserver 完整列表
    真人房展示房号(如 Q23486), 官方房展示 ip:port, 都可直接用于 /铁锈查房
    支持按状态(房间中/游戏中)、人数(满/不满)、来源筛选
    支持按房主名/地图名搜索
  - 进房推广(默认关): 探针进房后自动发一条项目地址,
    冷却可配(默认 3 分钟, 按房间独立计算)
  - 支持黑白名单(用户/群)权限控制; 混合模式(@用户优先于#群, 同名互斥); 私聊策略可配
  - 自动撤回房间信息(按群/私聊独立配置, 支持通配符)
  - bin 缓存自动清理: 插件运行期间每隔 24 小时(可配置)删除 1 小时前的
    server_info_*.bin, 不再需要重启才清理
  - 探针脚本自愈: room_info.py 缺失或接口过旧时自动从仓库补齐
    (仅补探针脚本, 不会自动升级插件本体)
  - /铁锈查房调试 打印运行时状态, 便于排查配置问题
version: 2.0.0
astrbot_version: ">=4.9.0"
author: wcnmamrs
repo: "https://github.com/wcnmamrs/astrbot_plugin_rwinfo"
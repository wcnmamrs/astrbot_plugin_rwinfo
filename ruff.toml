# ruff 配置（插件目录级）：让 `ruff check` / `ruff format` 有一致的口径。
#
# - 行宽 100：本插件的注释与中文提示偏长，88 会把它们挤成多行，反而更难读。
# - 引号保持原样：文件里单双引号混用是有历史原因的，整体翻转只会制造噪音。
# - lint 只开官方默认集（E4/E7/E9/F）：插件里大量 `except Exception` 是为了
#   「一条消息解析失败不能把整个机器人带崩」，开启 BLE001/S110 只会逼出几百个
#   `noqa`，反而掩盖真正的问题。
line-length = 100
target-version = "py310"

[format]
quote-style = "preserve"

[lint]
select = ["E4", "E7", "E9", "F"]
# E702（一行多个分号语句）在本文件里是刻意写法：解析二进制包时
# `r.byte(); relay_ver = r.int32(); r.int32(); r.boolean()` 这样按字节顺序排一行，
# 拆成四行反而看不出字段顺序。
ignore = ["E702"]
